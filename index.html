<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pametna Bašta - Kontrola Zalivanja</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      background: #0b1221;
      color: #e2e8f0;
      font-family: "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #111827;
      border-radius: 20px;
      padding: 30px;
      width: 380px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h2 {
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .status-pill.online span {
      color: #10b981;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    #water-btn {
      background: #10b981;
      color: white;
      width: 100%;
      margin: 10px 0 20px 0;
    }

    #water-btn.watering {
      background: #ef4444;
    }

    .field {
      margin-bottom: 12px;
    }

    select, input {
      background: #1e293b;
      color: #f1f5f9;
      border: none;
      border-radius: 8px;
      padding: 8px;
      width: 100%;
    }

    .schedule-item {
      background: #1e293b;
      padding: 10px;
      border-radius: 10px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete {
      background: none;
      border: none;
      color: #f87171;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Pametna Bašta</h2>
    <p>Terasa & Sistem za zalivanje</p>
    <div class="status-pill offline" id="status-pill"><span id="status-label">Offline</span></div>

    <p>Status pumpe: <span id="pump-status">U mirovanju</span></p>
    <button id="water-btn" onclick="toggleWater()">Pokreni zalivanje</button>

    <h3>Raspored</h3>
    <div class="field">
      <label>Sat:</label>
      <select id="hour-select"></select>
    </div>
    <div class="field">
      <label>Minut:</label>
      <select id="minute-select"></select>
    </div>
    <div class="field">
      <label>Trajanje (sekunde):</label>
      <input type="number" id="duration-sec" value="30">
    </div>
    <div class="field">
      <label>Učestalost:</label>
      <select id="frequency-select">
        <option value="1">Jednom dnevno</option>
        <option value="0.5">Svaka 2 dana</option>
        <option value="0.333">Svaka 3 dana</option>
        <option value="0.143">Jednom nedeljno</option>
      </select>
    </div>
    <button onclick="saveSchedule()">+ Dodaj raspored</button>

    <div id="schedule-list"><p>Nema sačuvanih rasporeda</p></div>
  </div>

  <script>
    const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
    const PREFIX = 'basta_tatijana_9f3k';

    const topicKomanda       = PREFIX + '/pumpa/komanda';
    const topicStatus        = PREFIX + '/pumpa/status';
    const topicRasporedDodaj = PREFIX + '/raspored/dodaj';
    const topicRasporedLista = PREFIX + '/raspored/lista';
    const topicRasporedUkloni= PREFIX + '/raspored/ukloni';

    let pumpaRadi = false;

    const client = mqtt.connect(MQTT_URL, { clientId: 'web_' + Math.random().toString(16).slice(2) });

    client.on('connect', () => {
      document.getElementById('status-pill').classList.remove('offline');
      document.getElementById('status-pill').classList.add('online');
      document.getElementById('status-label').innerText = 'Online';
      client.subscribe([topicStatus, topicRasporedLista]);
    });

    client.on('message', (topic, message) => {
      const tekst = message.toString();
      if (topic === topicStatus) {
        primeniStatusPumpe(tekst === 'ON');
      } else if (topic === topicRasporedLista) {
        prikaziRasporede(JSON.parse(tekst));
      }
    });

    function toggleWater() {
      const komanda = pumpaRadi ? 'OFF' : 'ON';
      client.publish(topicKomanda, komanda);
      primeniStatusPumpe(komanda === 'ON');
    }

    function primeniStatusPumpe(radi) {
      pumpaRadi = radi;
      const btn = document.getElementById('water-btn');
      const statusText = document.getElementById('pump-status');
      if (radi) {
        btn.classList.add('watering');
        btn.innerText = "Zaustavi zalivanje";
        statusText.innerText = "Radi";
      } else {
        btn.classList.remove('watering');
        btn.innerText = "Pokreni zalivanje";
        statusText.innerText = "U mirovanju";
      }
    }

    // popuni dropdown
    const hourSelect = document.getElementById('hour-select');
    const minuteSelect = document.getElementById('minute-select');
    for (let h = 0; h < 24; h++) {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = String(h).padStart(2,'0');
      hourSelect.appendChild(opt);
    }
    for (let m = 0; m < 60; m++) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = String(m).padStart(2,'0');
      minuteSelect.appendChild(opt);
    }

    function saveSchedule() {
      const hour = parseInt(hourSelect.value);
      const minute = parseInt(minuteSelect.value);
      const trajanjeSek = parseInt(document.getElementById('duration-sec').value);
      const ucestalostDana = parseFloat(document.getElementById('frequency-select').value);

      client.publish(topicRasporedDodaj, JSON.stringify({ hour, minute, trajanjeSek, ucestalostDana }));
    }

    function prikaziRasporede(data) {
      const list = document.getElementById('schedule-list');
      list.innerHTML = '';
      if (!data || data.length === 0) {
        list.innerHTML = '<p>Nema sačuvanih rasporeda</p>';
        return;
      }
      data.forEach((s, idx) => {
        if (s.aktivan !== false) {
          const item = document.createElement('div');
          item.className = 'schedule-item';
          item.innerHTML = `<span><b>${String(s.hour).padStart(2,'0')}:${String(s.minute).padStart(2,'0')}</b> · ${s.trajanjeSek}s · ${s.ucestalostDana}/dan</span>
                            <button class="delete" onclick="client.publish('${topicRasporedUkloni}', '${idx}')">✕</button>`;
          list.appendChild(item);
        }
      });
    }
  </script>
</body>
</html>
