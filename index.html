<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Pump Control</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <h2>Kontrola pumpe</h2>
  <button onclick="pumpOn()">Uključi</button>
  <button onclick="pumpOff()">Isključi</button>

  <h2>Raspored</h2>
  <label for="time">Vreme (HH:MM):</label>
  <input type="time" id="time" step="60" required>
  <br>
  <label for="duration">Trajanje (sekunde):</label>
  <input type="number" id="duration" value="10">
  <br>
  <label for="interval">Interval:</label>
  <select id="interval">
    <option value="daily">Daily</option>
    <option value="every2days">Every 2 days</option>
    <option value="weekly">Weekly</option>
  </select>
  <br>
  <button onclick="setSchedule()">Pošalji raspored</button>

  <script>
    // MQTT konekcija
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
      reconnectPeriod: 2000
    });

    client.on("connect", () => {
      console.log("✅ MQTT povezan!");
    });

    function pumpOn() {
      client.publish("tatijana/pump/control", "ON");
    }

    function pumpOff() {
      client.publish("tatijana/pump/control", "OFF");
    }

    function setSchedule() {
      const timeValue = document.getElementById("time").value; // npr. "16:11"
      if (!timeValue) {
        alert("⚠️ Morate uneti vreme!");
        return;
      }

      const parts = timeValue.split(":");
      const hour = parseInt(parts[0], 10);
      const minute = parseInt(parts[1], 10);
      const duration = parseInt(document.getElementById("duration").value, 10);
      const interval = document.getElementById("interval").value;

      const scheduleMsg = JSON.stringify({
        hour: hour,
        minute: minute,
        duration: duration,
        interval: interval
      });

      console.log("📤 Šaljem raspored:", scheduleMsg);
      client.publish("tatijana/pump/schedule", scheduleMsg);
      alert("✅ Raspored poslat ESP32-u!");
    }
  </script>
</body>
</html>
