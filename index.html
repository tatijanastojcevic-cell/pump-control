<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>Zalivanje biljaka</title>
  <!-- prvo učitavamo MQTT biblioteku -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Arial; background-color: #f0fff0; color: #1a5c30; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #2e7d32; }
    .card { background: white; border-radius: 10px; padding: 20px; margin: 20px auto; width: 90%; max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    button { font-size: 1.1em; padding: 12px 24px; margin: 10px; border: none; border-radius: 6px; cursor: pointer; }
    button.on { background-color: #4caf50; color: white; }
    button.off { background-color: #f44336; color: white; }
    input, select { font-size: 1em; padding: 8px; margin: 5px; border-radius: 6px; border: 1px solid #ccc; }
    .status { font-size: 1.2em; font-weight: bold; margin-top: 10px; }
    .status.on { color: #4caf50; }
    .status.off { color: #f44336; }
    #clock { font-size: 1.4em; font-weight: bold; margin: 10px; color: #2e7d32; }
  </style>
</head>
<body>
  <h1>🌿 Zalivanje biljaka</h1>
  <div id="clock">--:--:--</div>

  <div class="card">
    <h2>Ručno upravljanje</h2>
    <button class="on" onclick="mqttPublish('ON')">Uključi pumpu</button>
    <button class="off" onclick="mqttPublish('OFF')">Isključi pumpu</button>
    <p id="status" class="status">Status pumpe: Nepoznato</p>
  </div>

  <div class="card">
    <h2>Raspored zalivanja</h2>
    <form onsubmit="setSchedule(); return false;">
      <label>Sat: <input type="number" id="hour" min="0" max="23" required></label>
      <label>Minut: <input type="number" id="minute" min="0" max="59" required></label><br>
      <label>Trajanje (sekunde): <input type="number" id="duration" min="1" required></label><br>
      <label>Interval:
        <select id="interval">
          <option value="daily">Svaki dan</option>
          <option value="every2days">Svakih 2 dana</option>
          <option value="weekly">Jednom nedeljno</option>
        </select>
      </label><br>
      <button type="submit" class="on">Sačuvaj raspored</button>
    </form>
  </div>

  <div class="card">
    <h2>Aktivan raspored</h2>
    <p id="scheduleDisplay">Nema sačuvanog rasporeda</p>
  </div>

  <script>
    // MQTT konekcija (WSS jer je stranica na HTTPS)
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    client.on("connect", () => {
      console.log("MQTT povezan");
      client.subscribe("tatijana/pump/status");
      client.subscribe("tatijana/pump/schedule/status");
    });

    client.on("message", (topic, message) => {
      if (topic === "tatijana/pump/status") {
        const msg = message.toString();
        const statusEl = document.getElementById("status");
        statusEl.innerText = "Status pumpe: " + msg;
        statusEl.className = "status " + (msg === "Radi" ? "on" : "off");
      }
      if (topic === "tatijana/pump/schedule/status") {
        document.getElementById("scheduleDisplay").innerText = "Raspored: " + message.toString();
      }
    });

    function mqttPublish(msg) {
      client.publish("tatijana/pump/control", msg);
      console.log("Poslato: " + msg);
    }

    function setSchedule() {
      const hour = document.getElementById("hour").value;
      const minute = document.getElementById("minute").value;
      const duration = document.getElementById("duration").value;
      const interval = document.getElementById("interval").value;

      const scheduleMsg = JSON.stringify({
        hour: parseInt(hour),
        minute: parseInt(minute),
        duration: parseInt(duration),
        interval: interval
      });

      client.publish("tatijana/pump/schedule", scheduleMsg);
      alert("Raspored poslat ESP32-u!");
    }

    // digitalni sat
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById("clock").innerText = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
