<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Basta Tatijana</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <h2>🌿 Kontrola pumpe</h2>
  <button onclick="client.publish('basta_tatijana_9f3k/pumpa/komanda','ON')">ON</button>
  <button onclick="client.publish('basta_tatijana_9f3k/pumpa/komanda','OFF')">OFF</button>
  <p>Status pumpe: <span id="status">?</span></p>

  <h2>📅 Dodaj raspored</h2>
  Sat: <input id="hour" type="number" min="0" max="23">
  Minut: <input id="minute" type="number" min="0" max="59">
  Trajanje (sekunde): <input id="trajanje" type="number" min="1">
  <button onclick="dodajRaspored()">Dodaj</button>

  <h2>📋 Lista rasporeda</h2>
  <div id="rasporedLista"></div>

<script>
  // MQTT konekcija
  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  client.on("connect", function() {
    console.log("✅ Povezan na MQTT broker");
    client.subscribe("basta_tatijana_9f3k/pumpa/status");
    client.subscribe("basta_tatijana_9f3k/raspored/lista");
  });

  client.on("message", function(topic, message) {
    if (topic === "basta_tatijana_9f3k/pumpa/status") {
      document.getElementById("status").innerText = message.toString();
    }

    if (topic === "basta_tatijana_9f3k/raspored/lista") {
      let lista = JSON.parse(message.toString());
      let html = "";
      lista.forEach((r, i) => {
        if (r.aktivan !== false) {
          html += `<div>
            ⏰ ${r.hour}:${r.minute}, trajanje ${r.trajanjeSek}s
            <button onclick="ukloniRaspored(${i})">Ukloni</button>
          </div>`;
        }
      });
      document.getElementById("rasporedLista").innerHTML = html;
    }
  });

  function dodajRaspored() {
    let h = document.getElementById("hour").value;
    let m = document.getElementById("minute").value;
    let t = document.getElementById("trajanje").value;

    let raspored = {
      hour: parseInt(h),
      minute: parseInt(m),
      trajanjeSek: parseInt(t)
    };

    client.publish("basta_tatijana_9f3k/raspored/dodaj", JSON.stringify(raspored));
  }

  function ukloniRaspored(index) {
    client.publish("basta_tatijana_9f3k/raspored/ukloni", String(index));
  }
</script>
</body>
</html>
